name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get packages
        run: flutter pub get

      - name: Verify generated database code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Configure release signing (only if secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.GAMEBOX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GAMEBOX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GAMEBOX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GAMEBOX_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets: release APKs will be signed with the DEBUG key (testing only)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gamebox-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/gamebox-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Release signing configured."

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APKs (per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Checksums and APK details
        run: |
          cd build/app/outputs/flutter-apk
          ls -la
          sha256sum *.apk | tee SHA256SUMS.txt
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          for f in *release.apk; do echo "== signer of $f"; "$APKSIGNER" verify --print-certs "$f" | grep -E "Signer #1 certificate (DN|SHA-256)" || true; done
          for f in *.apk; do echo "== $f"; "$AAPT2" dump badging "$f" | grep -E "^(package|minSdkVersion|sdkVersion|targetSdkVersion|native-code|application-label|launchable-activity|leanback-launchable-activity):|uses-feature.*(leanback|touchscreen|gamepad)" || true; done

      - name: Manifest merge diagnostics (minSdk source)
        run: |
          for f in $(find build/app -name "manifest-merger-*release-report.txt" -o -name "manifest-merger-blame-*release-report.txt" | sort); do
            echo "== $f"; grep -n -B1 -A3 -i "uses-sdk\|minSdk" "$f" | head -40 || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: gamebox-apks
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error

  # Runs the app on real Android emulators: on-device integration tests
  # (native layer, bundled SQLite, files, FileProvider, UI) and HOME-launcher
  # checks with adb. API 24 is GAMEBOX's minimum Android version.
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 24, target: default, arch: x86_64, experimental: false }
          - { api: 34, target: google_apis, arch: x86_64, experimental: false }
          # Real Android TV system image (x86 only for this API level).
          - { api: 30, target: android-tv, arch: x86, experimental: true }
    continue-on-error: ${{ matrix.experimental }}
    name: device-tests (API ${{ matrix.api }} ${{ matrix.target }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK (real app, for launcher checks)
        run: |
          flutter pub get
          flutter build apk --debug

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          # 1920x1080 landscape TV screen (built-in AVD device profile).
          profile: tv_1080p
          ram-size: 2048M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./tool/ci_device_tests.sh

