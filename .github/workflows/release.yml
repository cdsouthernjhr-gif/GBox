name: Release

# Publishes a GitHub Release with signed APKs when a version tag is pushed
# (e.g. `git tag v0.8.0 && git push origin v0.8.0`). Requires the signing
# secrets described in docs/BUILD_GUIDE.md; refuses to publish debug-signed
# builds.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Check tag matches pubspec version
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version v$VERSION" >&2
            exit 1
          fi

      - name: Configure release signing (required)
        env:
          KEYSTORE_BASE64: ${{ secrets.GAMEBOX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GAMEBOX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GAMEBOX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GAMEBOX_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Signing secrets are missing; refusing to publish a debug-signed release." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gamebox-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/gamebox-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build signed APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify signature is not the debug key
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          cd build/app/outputs/flutter-apk
          for f in *-release.apk; do
            "$APKSIGNER" verify --print-certs "$f" | tee /tmp/cert.txt
            if grep -q "CN=Android Debug" /tmp/cert.txt; then echo "$f is debug-signed" >&2; exit 1; fi
          done
          sha256sum *-release.apk | tee SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/*-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          body_path: docs/RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') || startsWith(github.ref_name, 'v0.') }}
