name: Release

# Publishes a GitHub Release with signed APKs when a version tag is pushed
# (e.g. `git tag v0.8.0 && git push origin v0.8.0`). Requires the signing
# secrets described in docs/BUILD_GUIDE.md; refuses to publish debug-signed
# builds.
# Run it by hand (Actions → Release → Run workflow):
#  * publish unticked (default): dry run. Builds and verifies the signed
#    APKs and uploads them as an artifact; publishes nothing.
#  * publish ticked: also creates the tag v<pubspec version> on the
#    selected commit and publishes the GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish: create tag v<version> and the GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Check version and release notes
        id: ver
        env:
          PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+ ]+).*/\1/')
          echo "pubspec version: $VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version v$VERSION" >&2
            exit 1
          fi
          grep -q "appVersion = '$VERSION'" lib/core/constants/app_info.dart \
            || { echo "lib/core/constants/app_info.dart appVersion is not $VERSION" >&2; exit 1; }
          # Only this version's section of RELEASE_NOTES.md becomes the release text.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v "+") == 1 || index($0, "## " v " ") == 1) found=1 }
            found { print }
          ' docs/RELEASE_NOTES.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "docs/RELEASE_NOTES.md has no section for $VERSION" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"
          if [ "$GITHUB_REF_TYPE" != tag ] && [ "$PUBLISH" = true ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
              echo "Tag v$VERSION already exists; bump the version before publishing again" >&2
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure release signing (required)
        env:
          KEYSTORE_BASE64: ${{ secrets.GAMEBOX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GAMEBOX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GAMEBOX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GAMEBOX_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Signing secrets are missing; refusing to publish a debug-signed release." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gamebox-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/gamebox-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build signed APKs
        run: flutter build apk --release --split-per-abi

      - name: Verify signature is not the debug key
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          cd build/app/outputs/flutter-apk
          for f in *-release.apk; do
            "$APKSIGNER" verify --print-certs "$f" | tee /tmp/cert.txt
            if grep -q "CN=Android Debug" /tmp/cert.txt; then echo "$f is debug-signed" >&2; exit 1; fi
          done
          sha256sum *-release.apk | tee SHA256SUMS.txt

      - name: Upload signed APKs (dry run and tag runs)
        uses: actions/upload-artifact@v4
        with:
          name: gamebox-release-apks
          path: |
            build/app/outputs/flutter-apk/*-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/*-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: GAMEBOX ${{ steps.ver.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          prerelease: ${{ contains(steps.ver.outputs.version, '-') || startsWith(steps.ver.outputs.version, '0.') }}
