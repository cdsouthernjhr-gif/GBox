name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get packages
        run: flutter pub get

      - name: Verify generated database code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Configure release signing (only if secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.GAMEBOX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GAMEBOX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GAMEBOX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GAMEBOX_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets: release APKs will be signed with the DEBUG key (testing only)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gamebox-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/gamebox-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Release signing configured."

      - name: Fetch libretro cores (built-in player)
        run: ./tool/fetch_cores.sh

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APKs (per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Check native libraries (16 KB alignment, pinned core builds)
        run: tool/check_native_libs.sh android/app/src/main/jniLibs build/app/outputs/flutter-apk/*-release.apk

      - name: Checksums and APK details
        run: |
          cd build/app/outputs/flutter-apk
          ls -la
          sha256sum *.apk | tee SHA256SUMS.txt
          # The built-in player's cores must be in every APK (PPSSPP: ARM only).
          for f in *.apk; do
            for core in fceumm snes9x gambatte mgba genesis_plus_gx pcsx_rearmed mupen64plus_next_gles3 desmume fbneo; do
              unzip -l "$f" | grep -q "lib/.*/lib${core}_libretro_android.so" || { echo "$f is missing the $core core" >&2; exit 1; }
            done
            if unzip -l "$f" | grep -qE "lib/(arm64-v8a|armeabi-v7a)/"; then
              unzip -l "$f" | grep -q "lib/.*/libppsspp_libretro_android.so" || { echo "$f is missing the ppsspp core" >&2; exit 1; }
              unzip -l "$f" | grep -q "assets/ppsspp.zip" || { echo "$f is missing PPSSPP's assets" >&2; exit 1; }
            fi
            echo "$f: all built-in player cores present"
          done
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          for f in *release.apk; do echo "== signer of $f"; "$APKSIGNER" verify --print-certs "$f" | grep -E "Signer #1 certificate (DN|SHA-256)" || true; done
          for f in *.apk; do echo "== $f"; "$AAPT2" dump badging "$f" | grep -E "^(package|minSdkVersion|sdkVersion|targetSdkVersion|native-code|application-label|launchable-activity|leanback-launchable-activity):|uses-feature.*(leanback|touchscreen|gamepad)" || true; done

      - name: Check R8 kept the built-in player's JNI names
        run: |
          # R8 must keep the names LibretroDroid's native code looks up (JNI),
          # else the built-in player crashes in release builds (0.12.0).
          M=build/app/outputs/mapping/release/mapping.txt
          if [ ! -f "$M" ]; then echo "no R8 mapping at $M" >&2; exit 1; fi
          for c in LibretroDroid GLRetroView GLRetroShader Variable Controller DetachedVirtualFile; do
            grep -q "^com.swordfish.libretrodroid.$c -> com.swordfish.libretrodroid.$c:" "$M" \
              || { echo "R8 renamed or removed com.swordfish.libretrodroid.$c" >&2; exit 1; }
          done
          # Methods called from native code must not be renamed.
          for m in refreshAspectRatio sendRumbleEvent; do
            if grep -E " $m\(" "$M" | grep -vqE -- "-> $m$"; then
              echo "R8 renamed GLRetroView.$m" >&2; exit 1
            fi
          done
          echo "R8 kept LibretroDroid's JNI names"

      - name: Manifest merge diagnostics (minSdk source)
        run: |
          for f in $(find build/app -name "manifest-merger-*release-report.txt" -o -name "manifest-merger-blame-*release-report.txt" | sort); do
            echo "== $f"; grep -n -B1 -A3 -i "uses-sdk\|minSdk" "$f" | head -40 || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: gamebox-apks
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error

  # Runs the app on real Android emulators: on-device integration tests
  # (native layer, bundled SQLite, files, FileProvider, UI) and HOME-launcher
  # checks with adb. API 24 is GAMEBOX's minimum Android version.
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          # google_apis: the 'default' API 24 image hung on every install from run #26 on.
          - { api: 24, target: google_apis, arch: x86_64, experimental: false }
          - { api: 34, target: google_apis, arch: x86_64, experimental: false }
          # No Android TV image: the API 30 android-tv image is 32-bit x86,
          # which Flutter does not support ("unsupported" device, run #14),
          # and the API 34 android-tv x86_64 image did not boot on the
          # runner (run #13). TV behaviour is covered by the tv_1080p
          # profile here and by the physical-box checklist (TESTING_GUIDE).
    continue-on-error: ${{ matrix.experimental }}
    name: device-tests (API ${{ matrix.api }} ${{ matrix.target }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK (real app, for launcher checks)
        run: |
          ./tool/fetch_cores.sh
          flutter pub get
          flutter build apk --debug
          # Release build (R8) for the built-in player check in ci_device_tests.sh.
          flutter build apk --release --target-platform android-x64

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          # 1920x1080 landscape TV screen (built-in AVD device profile).
          profile: tv_1080p
          ram-size: 2048M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: ./tool/ci_device_tests.sh

